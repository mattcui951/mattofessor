[package]
name = "mattofessor"
version = "1.0.27"
description = "Mattofessor - League of Legends player stats and in-game scouting"
authors = ["Matt"]
license = "MIT"
edition = "2021"

[lib]
name = "mattofessor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
urlencoding = "2"
base64 = "0.22"
chrono = "0.4"
log = "0.4"
dirs = "6"
tauri-plugin-updater = "2"
sha2 = "0.10"
png = "0.17"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
libc = "0.2"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDictionary", "NSString", "NSValue", "NSRange", "NSError", "NSGeometry", "NSRunLoop", "NSDate", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSPanel", "NSResponder", "NSScreen", "NSRunningApplication", "NSGraphics", "NSApplication"] }
objc2-core-foundation = { version = "0.3", features = ["CFArray", "CFDictionary", "CFNumber", "CFString", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", features = ["CGWindow", "CGImage", "CGDirectDisplay", "CGColorSpace", "CGContext", "CGBitmapContext", "CGGeometry", "CGDisplayConfiguration"] }
objc2-vision = { version = "0.3", features = ["VNRequest", "VNRecognizeTextRequest", "VNObservation", "VNRequestHandler", "VNTypes", "objc2-core-graphics"] }
objc2-screen-capture-kit = { version = "0.3", features = ["SCShareableContent", "SCStream", "SCScreenshotManager", "block2", "objc2-core-graphics"] }
security-framework = "3"
tauri-plugin-global-shortcut = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
